# Phase 4 (plan2.md 4.1) capacity sweep: mamba_ssm at d_model 64, d_state 16.
# 147,584 params (+640 ablation-only constants, unused here). Locked mamba_ssm recipe.
arch: mamba_ssm
seed: 0
vocab_size: 256       # MQAR needs >= 64 keys; (256 - 1) // 2 = 127 keys, chance 1/127
max_steps: 4000
warmup_steps: 200
lr: 1.0e-3            # locked in 0.3 for both archs; do not change
weight_decay: 0.1
grad_clip: 1.0
batch_size: 32
eval_every: 250
eval_batches: 8
decay_1d: false

model:
  n_layers: 4
  d_model: 64
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.0
  emb_init_std: 1.0
  out_proj_depth_scale: true
  use_fast_path: true
