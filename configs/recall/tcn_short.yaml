# Short-reach TCN for the reach curve (plan2.md 3.1): receptive field 127, so it can see
# a data token only if it lies within 126 positions before the answer.
# 440,088 params, matched to mamba_ssm_small (448,632) within 1.9%. Same training settings
# as tcn_small.yaml (lr 3e-4 locked in 0.3 for the TCN). RF = 1 + (3-1) * (1+2+4+8+16+32).
arch: tcn
seed: 0
vocab_size: 64

max_steps: 4000
warmup_steps: 200
lr: 3.0e-4            # locked by plan2.md 0.3 lr check (results/phase0_3_lr); do not change
weight_decay: 0.1
grad_clip: 1.0
batch_size: 32
eval_every: 250
eval_batches: 8

model:
  n_layers: 6       # -> 440,088 params at vocab_size 64; receptive field 127
  d_model: 132
  kernel_size: 3
  dropout: 0.0
