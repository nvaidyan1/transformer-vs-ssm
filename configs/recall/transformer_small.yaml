# Small transformer for synthetic-task experiments.
# 667,264 params; matched to tcn_small (670,080) within 0.5%. mamba_small is
# 448,632 (+1,120 ablation-only), NOT matched; re-matching is plan2.md 0.3.
arch: transformer
seed: 0
vocab_size: 64

# Optimisation
max_steps: 4000
warmup_steps: 200
lr: 3.0e-4          # override per-architecture from the LR sweep
weight_decay: 0.1   # applied via src/optim.py grouping, not uniformly
grad_clip: 1.0
batch_size: 32
eval_every: 250
eval_batches: 8

model:
  n_layers: 3       # -> 667,264 params at vocab_size 64
  d_model: 128
  n_heads: 4
  d_ff: 512
  dropout: 0.0
  max_seq_len: 512
