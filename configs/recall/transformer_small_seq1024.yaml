# Transformer for the seq_len-1024 settings of plan2.md 1.2 ONLY (author, 2026-11-12):
# identical to transformer_small.yaml except max_seq_len 1024. Reference arm, not gated.
# Parameters: 505,544 total = 399,048 + 106,496 positional table (1024 x 104).
# Without the positional table it is 11.1% below mamba_ssm_small's 448,632; with the
# 512 table (transformer_small.yaml) it is +0.8% in total, also 399,048 without it.
# Small transformer for synthetic-task experiments.
# 452,296 params: matched to mamba_ssm_small / mamba_small (448,632 trainable) within
# 0.8% and tcn_small (450,212) within 0.5% (plan2.md 0.3). Was d_model 128 / 667,264.
arch: transformer
seed: 0
vocab_size: 64

# Optimisation
max_steps: 4000
warmup_steps: 200
lr: 1.0e-3            # locked by plan2.md 0.3 lr check (results/phase0_3_lr); do not change
weight_decay: 0.1   # applied via src/optim.py grouping, not uniformly
grad_clip: 1.0
batch_size: 32
eval_every: 250
eval_batches: 8

model:
  n_layers: 3       # -> 452,296 params at vocab_size 64
  d_model: 104     # head size 26
  n_heads: 4
  d_ff: 416
  dropout: 0.0
  max_seq_len: 1024  # seq_len-1024 settings only (plan2.md 1.2, author 2026-11-12)
